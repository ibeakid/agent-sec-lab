repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/semgrep/pre-commit
    rev: v1.180.0
    hooks:
      - id: semgrep
        files: ^app/
        args:
          - --config=semgrep-rules/
          - --error
          - --metrics=off
          - --quiet
          - --skip-unknown-extensions
          - --disable-version-check