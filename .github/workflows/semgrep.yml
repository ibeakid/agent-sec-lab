name: semgrep

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.180.0
      - name: Test custom rules
        run: semgrep --test --metrics=off semgrep-rules/
      - name: Scan app
        run: semgrep scan --config semgrep-rules/ --error --metrics=off app/